name: Format Go once
on:
  push:
    branches: [feat/bootstrap-foundation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bootstrap-foundation
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.29.0
      - name: Format all Go files
        run: |
          find cmd internal -name '*.go' -print0 | xargs -0 gofmt -w
          find cmd internal -name '*.go' -print0 | xargs -0 "$(go env GOPATH)/bin/goimports" -w
          git diff --stat
      - name: Push formatting
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add cmd internal
            git commit -m 'style(go): apply gofmt and goimports throughout'
            git push origin HEAD:feat/bootstrap-foundation
          fi
