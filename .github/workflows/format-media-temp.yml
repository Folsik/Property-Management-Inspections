name: Temporary media Go formatting
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/**"
      - "internal/app/**"
      - ".github/workflows/format-media-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.x"}
      - name: Format media service
        run: gofmt -w internal/api/media*.go internal/api/server.go internal/api/web_read.go internal/api/integration_test.go internal/app/app.go
      - name: Commit gofmt to integration only
        run: |
          if ! git diff --quiet -- internal/api internal/app; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api internal/app
            git commit -m "style(media): gofmt media lifecycle and cleanup code"
            git push origin HEAD:feat/bootstrap-foundation
          fi
