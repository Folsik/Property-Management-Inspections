name: Temporary full Go formatting
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - ".github/workflows/format-all-go-temp.yml"
      - "internal/**"
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: List and format every Go file
        run: |
          gofmt -l $(find cmd internal -name '*.go')
          gofmt -w $(find cmd internal -name '*.go')
      - name: Save formatting
        run: |
          if ! git diff --quiet -- cmd internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal
            git commit -m "style(sync): gofmt all backend source and security tests"
            git push origin HEAD:feat/bootstrap-foundation
          fi
