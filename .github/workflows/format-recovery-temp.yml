name: Temporary Go format for recovery
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/password.go"
      - "internal/api/password_recovery.go"
      - "internal/api/server.go"
      - "internal/auth/token.go"
      - "internal/api/password_test.go"
      - "internal/api/onboarding_integration_test.go"
      - ".github/workflows/format-recovery-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.x"}
      - run: gofmt -w internal/api/password.go internal/api/password_recovery.go internal/api/server.go internal/auth/token.go internal/api/password_test.go internal/api/onboarding_integration_test.go
      - name: Commit formatter changes
        run: |
          if ! git diff --quiet -- internal/api internal/auth; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api internal/auth
            git commit -m "style(auth): gofmt recovery handlers and token changes"
            git push origin HEAD:feat/bootstrap-foundation
          fi
