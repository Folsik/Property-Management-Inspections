name: Temporary stage4 formatter
on:
  push:
    branches: [feat/bootstrap-foundation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Refresh checkout before formatting
        run: |
          git fetch origin feat/bootstrap-foundation
          git checkout feat/bootstrap-foundation
          git reset --hard origin/feat/bootstrap-foundation
      - run: gofmt -w internal/jobs/*.go internal/api/processing.go internal/api/worker_media.go internal/api/job_metrics.go cmd/worker/main.go
      - name: Commit formatting only when necessary
        run: |
          if ! git diff --quiet -- internal/jobs internal/api/processing.go internal/api/worker_media.go cmd/worker/main.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/jobs internal/api/processing.go internal/api/worker_media.go cmd/worker/main.go
            git commit -m "style(workers): gofmt worker implementation"
            git pull --rebase origin feat/bootstrap-foundation
            git push origin HEAD:feat/bootstrap-foundation
          fi
