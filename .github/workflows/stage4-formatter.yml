name: Temporary stage4 formatter
on:
  push:
    branches: [feat/bootstrap-foundation]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: gofmt -w internal/jobs/*.go
      - name: Commit formatting only when necessary
        run: |
          if ! git diff --quiet -- internal/jobs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/jobs
            git commit -m "style(workers): gofmt worker implementation"
            git push
          fi
