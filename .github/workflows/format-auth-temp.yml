name: Temporary format auth Go
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/password.go"
      - "internal/api/onboarding.go"
      - "internal/api/server.go"
      - "internal/api/password_test.go"
      - ".github/workflows/format-auth-temp.yml"
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Apply gofmt to auth changes
        run: gofmt -w internal/api/password.go internal/api/password_test.go internal/api/onboarding.go internal/api/server.go internal/api/onboarding_integration_test.go
      - name: Commit formatted files
        run: |
          if ! git diff --quiet -- internal/api; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api
            git commit -m "style(auth): format password handlers and tests"
            git push origin HEAD:feat/bootstrap-foundation
          fi
