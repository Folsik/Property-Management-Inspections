name: Temporary audit gofmt
on:
  push:
    branches: [fix/pre-ios-security-audit]
permissions:
  contents: write
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pre-ios-security-audit
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: gofmt -w internal/api/processing_integration_test.go
      - name: Commit gofmt changes
        run: |
          if ! git diff --quiet -- internal/api/processing_integration_test.go; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api/processing_integration_test.go
            git commit -m "style(test): format stage4 isolation integration test"
            git pull --rebase origin fix/pre-ios-security-audit
            git push origin HEAD:fix/pre-ios-security-audit
          fi
