name: iOS SwiftUI build
on:
  push:
    branches: [main, feat/ios-foundation, feat/production-connectivity-testflight]
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "apps/ios/**"
      - ".github/workflows/ios.yml"
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: apps/ios
      - name: Compile local simulator Debug
        run: |
          xcodebuild -project Inspectly.xcodeproj -scheme Inspectly \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: apps/ios
      - name: Check staging and production configurations
        run: python3 scripts/check_release_configuration.py
        working-directory: apps/ios
      - name: Compile Staging and Release with CI-only HTTPS origins
        run: |
          set -euo pipefail
          for configuration in Staging Release; do
            xcodebuild -project Inspectly.xcodeproj -scheme Inspectly \
              -destination 'generic/platform=iOS Simulator' \
              -configuration "$configuration" \
              INSPECTLY_API_BASE_URL="https://ci-check.inspectly.app" \
              CODE_SIGNING_ALLOWED=NO build
          done
        working-directory: apps/ios
