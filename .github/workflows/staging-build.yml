name: Staging images
on:
  push:
    branches: [feat/bootstrap-foundation]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: apps/web
        run: npm ci --no-audit --no-fund && npm run build
  publish:
    needs: test
    if: github.ref == 'refs/heads/feat/bootstrap-foundation'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            file: Dockerfile
          - name: worker
            context: .
            file: Dockerfile.worker
          - name: web
            context: apps/web
            file: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/folsik/property-management-inspections-${{ matrix.name }}:${{ github.sha }}
