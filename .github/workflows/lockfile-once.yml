name: Generate web lockfile (temporary)
on:
  push:
    branches: [feat/nextjs-web-app]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nextjs-web-app
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(web): lock npm dependency versions'
            git push origin HEAD:feat/nextjs-web-app
          fi
