name: Temporary Go format for auth sessions
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/**"
      - "internal/auth/**"
      - ".github/workflows/format-sessions-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.x"}
      - name: Format Go code for auth hardening
        run: gofmt -w internal/api/*.go internal/auth/*.go
      - name: Commit gofmt output to integration branch
        shell: bash
        run: |
          if ! git diff --quiet -- internal/api internal/auth; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api internal/auth
            git commit -m "style(auth): gofmt session rotation and rate limiting"
            git push origin HEAD:feat/bootstrap-foundation
          fi
