name: Temporary Go formatter
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/**"
      - ".github/workflows/format-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Format new Go handlers and integration tests
        run: gofmt -w internal/api/*.go
      - name: Commit formatted code back into integration branch
        shell: bash
        run: |
          if ! git diff --quiet -- internal/api; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api
            git commit -m "style(api): gofmt onboarding and invitation handlers"
            git push origin HEAD:feat/bootstrap-foundation
          fi
