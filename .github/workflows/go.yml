name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: go mod download
      - name: Ensure gofmt clean
        run: test -z "$(gofmt -l $(find cmd internal -name '*.go'))"
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/api
