name: Temporary Stage 3 Go format
on:
  push:
    branches: [feat/bootstrap-foundation]
    paths:
      - "internal/api/**"
      - ".github/workflows/format-sync-temp.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.23.x"}
      - run: gofmt -w internal/api/server.go internal/api/web_read.go internal/api/sync.go internal/api/pagination.go internal/api/mobile_sync_integration_test.go internal/api/integration_test.go
      - name: Commit formatted Go files
        run: |
          if ! git diff --quiet -- internal/api; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/api
            git commit -m "style(sync): gofmt mobile sync endpoints and tests"
            git push origin HEAD:feat/bootstrap-foundation
          fi
