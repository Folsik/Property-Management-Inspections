name: Inspectly
options:
  bundleIdPrefix: com.inspectly
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Staging: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Inspectly
    INFOPLIST_KEY_NSCameraUsageDescription: "Capture property inspection photos."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record inspection voice notes."
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
targets:
  Inspectly:
    type: application
    platform: iOS
    sources: [Inspectly]
    info:
      path: Generated/Info.plist
      properties:
        InspectlyAPIBaseURL: $(INSPECTLY_API_BASE_URL)
        CFBundleDisplayName: Inspectly
        NSCameraUsageDescription: Capture property inspection photos.
        NSMicrophoneUsageDescription: Record inspection voice notes.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspectly.inspections
      configs:
        Debug:
          INSPECTLY_API_BASE_URL: "http://localhost:8080"
        Staging:
          INSPECTLY_API_BASE_URL: "https://staging-api.groupmax.ru"
        Release:
          INSPECTLY_API_BASE_URL: "https://api.example.invalid"
schemes:
  Inspectly:
    build:
      targets:
        Inspectly: all
    run:
      config: Debug
  Inspectly-Staging:
    build:
      targets:
        Inspectly: all
    run:
      config: Staging
    archive:
      config: Release
