name: Inspectly
options:
  bundleIdPrefix: com.inspectly
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Inspectly
    INFOPLIST_KEY_NSCameraUsageDescription: "Capture property inspection photos."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Record inspection voice notes."
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_InspectlyAPIBaseURL: "$(INSPECTLY_API_BASE_URL)"
    INFOPLIST_KEY_InspectlyEnvironment: "$(INSPECTLY_ENVIRONMENT)"
    INSPECTLY_API_BASE_URL: ""
targets:
  Inspectly:
    type: application
    platform: iOS
    sources: [Inspectly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspectly.inspections
      configs:
        Debug:
          INSPECTLY_ENVIRONMENT: local
          INSPECTLY_API_BASE_URL: "http://localhost:8080"
          INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        Staging:
          INSPECTLY_ENVIRONMENT: staging
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
        Release:
          INSPECTLY_ENVIRONMENT: production
    preBuildScripts:
      - name: Validate compiled API endpoint
        script: 'bash "$SRCROOT/scripts/validate_endpoint.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Inspectly:
    build:
      targets:
        Inspectly: all
    run:
      config: Debug
  Inspectly-Staging:
    build:
      targets:
        Inspectly: all
    run:
      config: Staging
    archive:
      config: Staging
