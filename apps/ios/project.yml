name: Inspectly
options:
  bundleIdPrefix: com.inspectly
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Inspectly
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
targets:
  Inspectly:
    type: application
    platform: iOS
    sources: [Inspectly]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inspectly.inspections
      configs:
        Debug:
          INFOPLIST_KEY_InspectlyAPIBaseURL: "http://localhost:8080"
        Release:
          INFOPLIST_KEY_InspectlyAPIBaseURL: "https://api.example.invalid"
    scheme:
      testTargets: []
