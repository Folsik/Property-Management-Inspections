name: inspectly-staging
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-db: &db
  APP_ENV: production
  DATABASE_URL: postgres://inspections:${POSTGRES_PASSWORD:?required}@postgres:5432/inspections?sslmode=verify-full&sslrootcert=/tls/ca.crt
x-media: &media
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
services:
  postgres:
    <<: *runtime
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inspections
      POSTGRES_USER: inspections
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/tls/server.crt", "-c", "ssl_key_file=/tls/server.key", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tls/postgres:/tls:ro
    networks: [data]
    mem_limit: 320m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspections -d inspections"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    <<: *runtime
    image: ghcr.io/folsik/property-management-inspections-api:${IMAGE_TAG:?required}
    environment:
      <<: [*db, *media]
      HTTP_ADDR: ":8080"
      JWT_ISSUER: inspections-staging
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?required}
      TRUSTED_BFF_SECRET: ${TRUSTED_BFF_SECRET:?required}
      PUBLIC_WEB_URL: https://app.staging.groupmax.ru
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      GOMEMLIMIT: 180MiB
    volumes:
      - ./tls/ca.crt:/tls/ca.crt:ro
    networks: [edge, data]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.75
  worker:
    <<: *runtime
    image: ghcr.io/folsik/property-management-inspections-worker:${IMAGE_TAG:?required}
    environment:
      <<: [*db, *media]
      TRANSCRIPTION_ENDPOINT: ${TRANSCRIPTION_ENDPOINT:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
      GOMEMLIMIT: 180MiB
    volumes:
      - ./tls/ca.crt:/tls/ca.crt:ro
    networks: [data, outbound]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
  web:
    <<: *runtime
    image: ghcr.io/folsik/property-management-inspections-web:${IMAGE_TAG:?required}
    environment:
      GO_API_URL: http://api:8080
      TRUSTED_BFF_SECRET: ${TRUSTED_BFF_SECRET:?required}
      TRUSTED_INGRESS_SECRET: ${TRUSTED_INGRESS_SECRET:?required}
      WEB_LOCAL_OTP: "false"
      SESSION_COOKIE_SECURE: "true"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    networks: [edge]
    mem_limit: 384m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
  caddy:
    <<: *runtime
    image: caddy:2-alpine
    environment:
      TRUSTED_INGRESS_SECRET: ${TRUSTED_INGRESS_SECRET:?required}
      TRUSTED_BFF_SECRET: ${TRUSTED_BFF_SECRET:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    mem_limit: 64m
    cpus: 0.25
networks:
  edge: {}
  data:
    internal: true
  outbound: {}
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
