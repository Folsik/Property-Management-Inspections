services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inspections
      POSTGRES_USER: inspections
      POSTGRES_PASSWORD: inspections_dev_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspections -d inspections"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://inspections:inspections_dev_password@postgres:5432/inspections?sslmode=disable
      JWT_ISSUER: inspections-api
      ACCESS_TOKEN_TTL: 15m
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres_data:
