services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: inspections
      POSTGRES_USER: inspections
      POSTGRES_PASSWORD: inspections_dev_password
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspections -d inspections"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    environment:
      APP_ENV: development
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://inspections:inspections_dev_password@postgres:5432/inspections?sslmode=disable
      JWT_ISSUER: inspections-api
      ACCESS_TOKEN_TTL: 15m
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://inspections:inspections_dev_password@postgres:5432/inspections?sslmode=disable
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      TRANSCRIPTION_ENDPOINT: ${TRANSCRIPTION_ENDPOINT:-}
      TRANSCRIPTION_API_KEY: ${TRANSCRIPTION_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
  web:
    build:
      context: ./apps/web
    environment:
      GO_API_URL: http://api:8080
      # Local-only convenience: never enable on a public deployment.
      WEB_LOCAL_OTP: "true"
      SESSION_COOKIE_SECURE: "false"
      NODE_ENV: production
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      - api
volumes:
  postgres_data:
